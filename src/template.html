<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>daWeather</title>
    <link rel="icon" href="icons/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="icons/favicon-96x96.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="icons/apple-touch-icon.png"
    />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#80b3ff" />
  </head>
  <body>
    <div class="inputWrapper">
      <div class="searchBar">
        <input
          type="text"
          id="search"
          class="search"
          name="searchValue"
          enterkeyhint="search"
        />
        <button id="options" class="options">O</button>
      </div>
      <div class="spanDiv hidden">
        <div id="line"></div>
        <span id="error"></span>
      </div>
    </div>
    <div class="apiData"></div>
  </body>
</html>
